<div class="table-responsive">
  <table{{ with .TAttributes }} {{ delimit . " " }}{{ end }}>
    {{- range .THead }}
    <thead>
      <tr>
        {{- range . }}
        <th{{ with .Alignment }} class="text-{{ . }}"{{ end }}>{{ .Text | safeHTML }}</th>
        {{- end }}
      </tr>
    </thead>
    {{- end }}
    <tbody>
      {{- range .TBody }}
      <tr>
        {{- range . }}
        <td{{ with .Alignment }} class="text-{{ . }}"{{ end }}>{{ .Text | safeHTML }}</td>
        {{- end }}
      </tr>
      {{- end }}
    </tbody>
  </table>
</div>
